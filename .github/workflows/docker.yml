name: Docker

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY_IMAGE: ghcr.io/superworldsavior/mcp-prusaslicer

jobs:
  native-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected_tag="v$(node -p 'require("./deno.json").version')"
          test "$GITHUB_REF_NAME" = "$expected_tag"

      - name: Verify release gates with the qualified native engine
        # Keep this identical to the JSR gate: the image cannot publish with
        # weaker engine evidence than the package.
        run: |
          docker run --rm \
            --entrypoint /bin/sh \
            --user 0:0 \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --workdir /workspace \
            denoland/deno:debian@sha256:2014dc167ece617ef7e7ba40631ac2234c59e75ce693e7cc2dc2602b3c87859d \
            -eu -c '
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                prusa-slicer=2.9.2+dfsg-1
              test "$(dpkg-query -W -f=\${Version} prusa-slicer)" = "2.9.2+dfsg-1"
              prusa-slicer --help >/dev/null 2>&1
              PRUSASLICER_RUN_NATIVE=1 deno task release:check
            '

  build-push:
    needs: native-check
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.image.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  published-artifact-smoke:
    if: github.ref == 'refs/heads/main'
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Wait for the matching JSR publication workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$((SECONDS + 900))
          while [ "$SECONDS" -lt "$deadline" ]; do
            run=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow publish.yml \
              --commit "$GITHUB_SHA" \
              --json status,conclusion \
              --limit 1)
            status=$(printf '%s' "$run" | jq -r '.[0].status // "missing"')
            conclusion=$(printf '%s' "$run" | jq -r '.[0].conclusion // ""')
            if [ "$status" = completed ]; then
              test "$conclusion" = success
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for Publish to complete for $GITHUB_SHA" >&2
          exit 1

      - id: jsr
        name: Wait for the matching published JSR version to resolve
        run: |
          name=$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("deno.json")).name)')
          version=$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("deno.json")).version)')
          deadline=$((SECONDS + 300))
          while [ "$SECONDS" -lt "$deadline" ]; do
            body=$(curl --fail --silent --show-error "https://jsr.io/${name}/meta.json" || echo '{}')
            published=$(BODY="$body" VERSION="$version" deno eval 'const metadata = JSON.parse(Deno.env.get("BODY") ?? "{}"); console.log((Deno.env.get("VERSION") ?? "") in (metadata.versions ?? {}))')
            if [ "$published" = true ]; then
              echo "version=$version" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for ${name}@${version} on JSR" >&2
          exit 1

      - name: Smoke-test the published JSR package and pinned GHCR digest
        env:
          PUBLISHED_JSR_VERSION: ${{ steps.jsr.outputs.version }}
          PUBLISHED_GHCR_IMAGE: ${{ env.REGISTRY_IMAGE }}@${{ needs.build-push.outputs.image_digest }}
        run: deno task test:published
